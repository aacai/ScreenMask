name: Build & Release

on:
  # 手动触发，可勾选是否构建 Android
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android release APK"
        type: boolean
        default: true
  # 推送 tag（如 v1.0.0）时自动构建并发布 GitHub Release
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 同一 ref（tag）并发只保留最新一次，避免重推 tag 时多个 run 抢同一 Release 造成竞态与浪费。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ----------------------------------------------------------------
  # Android：产出 release APK（用同一 key.jks 签名，与本地一致）
  # 需配置仓库 Secrets（否则降级为 debug 签名，仍可产出 APK）：
  #   KEYSTORE_BASE64   - base64 编码的 key.jks（本地：base64 key.jks）
  #   KEYSTORE_PASSWORD - 密钥库密码
  #   KEY_ALIAS         - 密钥别名
  #   KEY_PASSWORD      - 密钥密码
  # ----------------------------------------------------------------
  android:
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Android signing keystore (from Secrets)
        # 仅当配置了 KEYSTORE_BASE64 时才还原 keystore；否则 release 降级为 debug 签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/androidApp/release-key.jks"
            echo "Keystore restored."
          else
            echo "No KEYSTORE_BASE64 secret; building with debug signing."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/androidApp/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Release：推送 tag 时把产物汇总发布到 GitHub Release
  # ----------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing release (clean stale assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes || true

      - name: Generate release notes
        run: |
          {
            echo "# ScreenMask ${GITHUB_REF_NAME}"
            echo
            echo "Android 安装包（release APK，可直接安装到手机）："
            echo
            find artifacts -type f -printf '%f\n' | sort | while read -r f; do
              printf -- '- `%s`\n' "$f"
            done
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release_notes.md

      # ----------------------------------------------------------------
      # 镜像到 Gitee Release（需仓库 Secrets: GITEE_TOKEN；缺省则跳过）
      # ----------------------------------------------------------------
      - name: Mirror to Gitee Release
        if: env.GITEE_TOKEN != ''
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: aacai
          GITEE_REPO: ScreenMask
        run: |
          TAG="${GITHUB_REF_NAME}"
          RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases?access_token=$GITEE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Automated mirror from GitHub Actions\"}")
          REL_ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$REL_ID" ]; then echo "Gitee release create failed: $RESP"; exit 1; fi
          find artifacts -type f | while read -r f; do
            curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$REL_ID/attach_files?access_token=$GITEE_TOKEN" \
              -F "file=@$f"
          done

      # ----------------------------------------------------------------
      # 镜像到 CNB Release（需仓库 Secrets: CNB_TOKEN，需 repo-code:rw；缺省则跳过）
      # ----------------------------------------------------------------
      - name: Mirror to CNB Release
        if: env.CNB_TOKEN != ''
        continue-on-error: true
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: aacai/ScreenMask
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          API="https://cnb.cool/$CNB_REPO"
          AUTH="Authorization: Bearer $CNB_TOKEN"
          BODY=$(jq -n --arg t "$TAG" --arg n "$TAG" '{name:$n, tag_name:$t, target_commitish:"master"}')
          RESP=$(curl -s -X POST "$API/-/releases" -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/json" -d "$BODY")
          REL_ID=$(echo "$RESP" | jq -r '.id // .release_id // empty')
          if [ -z "$REL_ID" ]; then echo "CNB release create failed: $RESP"; exit 1; fi
          find artifacts -type f | while read -r f; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            UP=$(curl -s -X POST "$API/-/releases/$REL_ID/asset-upload-url" -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"asset_name\":\"$NAME\",\"overwrite\":true,\"size\":$SIZE}")
            UPLOAD_URL=$(echo "$UP" | jq -r '.UploadURL // .upload_url // empty')
            VERIFY_URL=$(echo "$UP" | jq -r '.VerifyURL // .verify_url // empty')
            if [ -z "$UPLOAD_URL" ]; then echo "No CNB upload URL for $NAME: $UP"; continue; fi
            curl -s -X POST "$UPLOAD_URL" -F "file=@$f"
            if [ -n "$VERIFY_URL" ]; then curl -s -X POST "$VERIFY_URL" -H "$AUTH"; fi
          done
